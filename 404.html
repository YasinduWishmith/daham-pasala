<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dhamma School Manager</title>
  <script>
    // Unknown paths on GitHub Pages: go back to the app root (the app uses #/ routes).
    var parts = location.pathname.split('/');
    var base = location.hostname.endsWith('github.io') && parts.length > 2 ? '/' + parts[1] + '/' : '/';
    location.replace(base);
  </script>
</head>
<body style="font-family:sans-serif;padding:24px;background:#faf6f0">
  <p><a href="./">Open Dhamma School Manager</a></p>
</body>
</html>
